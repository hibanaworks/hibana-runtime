name: Runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: hibanaworks/hibana
          ref: c1d92129b0ae95572aaa53bb2e7455c20689bb43
          path: validation-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-12
          components: miri, rust-src
      - name: Install proof tools
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install z3 elan
          else
            sudo apt-get update
            sudo apt-get install -y z3 elan
          fi
          elan toolchain install leanprover/lean4:v4.34.1
      - name: Validate
        env:
          HIBANA_RESOURCE_GUARD: ${{ github.workspace }}/validation-core/.github/scripts/lib/resource_guard.sh
        run: |
          chmod u+x "$HIBANA_RESOURCE_GUARD"
          bash tools/check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: validation/
