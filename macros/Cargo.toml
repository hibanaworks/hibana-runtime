[package]
name = "hibana-runtime-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Async-body localside declarations for hibana-runtime"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }

[lints.rust]
long_running_const_eval = "forbid"
