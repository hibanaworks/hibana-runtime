[package]
name = "hibana-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A caller-stored local executor for Hibana localsides"
license = "MIT OR Apache-2.0"
keywords = ["hibana", "no-std", "no-alloc", "async", "embedded"]
categories = ["asynchronous", "concurrency", "embedded", "no-std::no-alloc"]

[dependencies]

[dev-dependencies]
hibana = "=0.9.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
